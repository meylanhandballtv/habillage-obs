<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Handball Overlay</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: 'Barlow Condensed', sans-serif;
      overflow: hidden;
    }

    /* ── SCOREBOARD ── */
    #scoreboard {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      height: 72px;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.7));
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #scoreboard.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
    }

    /* Team blocks */
    .team-block {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 30px;
      background: rgba(43, 87, 155, 0.92);
      min-width: 580px;
    }

    .team-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #FFFFFF;
      text-transform: uppercase;
      white-space: nowrap;
      max-width: 520px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Badges 2 minutes : positionnés hors du flux du bandeau (n'affectent jamais sa largeur/centrage),
     empilés verticalement, au bout du côté correspondant */
    .min2-badges {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }

    .min2-badges:empty {
      display: none;
    }

    #home-min2-badges {
      right: 100%;
      margin-right: 12px;
      align-items: flex-end;
    }

    #away-min2-badges {
      left: 100%;
      margin-left: 12px;
      align-items: flex-start;
    }

    .min2-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 24px;
      padding: 0 8px;
      background: #C8181E;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      border-radius: 3px;
    }

    /* Sanctions strip inside team block */
    .sanctions {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }

    .sanction-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Barlow', sans-serif;
      letter-spacing: 0.02em;
      padding: 2px 5px;
      border-radius: 2px;
      min-width: 22px;
      height: 20px;
      line-height: 1;
    }

    .badge-red {
      background: #D92B2B;
      color: #fff;
    }

    .badge-2min {
      background: #FF6B00;
      color: #fff;
    }

    .badge-zero {
      opacity: 0.25;
    }

    /* Center score area */
    #score-center {
      display: flex;
      align-items: stretch;
      background: rgba(43, 87, 155, 0.96);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .score-digit {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      width: 72px;
      padding: 0 4px;
    }

    .score-sep {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.3);
      padding: 0 4px;
    }

    /* Timer block */
    #timer-block {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgb(49,120,240);
      padding: 0 18px;
      min-width: 90px;
    }

    #timer-display {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    #period-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* TRC badge — bascule visuelle simple, sans décompte */
    #trc-badge {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: #FF6B00;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 2px 8px;
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #trc-badge.active {
      opacity: 1;
    }

    /* Home team is left, reversed layout */
    #team-home {
      flex-direction: row-reverse;
    }

    #team-home .team-name {
      text-align: right;
    }

    #team-home .sanctions {
      margin-left: 0;
      margin-right: auto;
    }

    /* ── TIMEOUT BANNER ── */
    #timeout-banner {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 10, 0.92);
      border-left: 4px solid #C8181E;
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    #timeout-banner.show {
      opacity: 1;
    }

    #timeout-label {
      font-size: 18px;
      font-weight: 800;
      color: #C8181E;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #timeout-team {
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #timeout-timer {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }
    /* ── TIRS AU BUT ── */
    .team-block { position: relative; }

    /* Rangée de tirs (une pastille par tir), posée au-dessus de chaque bloc équipe, côté centre */
    .so-row {
      position: absolute;
      bottom: 100%;
      margin-bottom: 10px;
      display: none;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(10, 10, 10, 0.92);
      border-bottom: 3px solid #F5C400;
    }
    #team-home .so-row { right: 0; }
    #team-away .so-row { left: 0; }
    #scoreboard.shootout .so-row { display: flex; }

    .so-pip {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }
    .so-pip.goal { background: #2E9E4F; border-color: #2E9E4F; }
    .so-pip.miss { background: #D92B2B; border-color: #D92B2B; }

    /* Bloc central : le chrono laisse la place au score des tirs au but */
    #so-tally {
      display: none;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #scoreboard.shootout #timer-display { display: none; }
    #scoreboard.shootout #so-tally { display: block; }
    #scoreboard.shootout #timer-block { background: #16284a; }
    #scoreboard.shootout #period-label { color: #F5C400; font-weight: 800; }

    /* Bandeau d'annonce à l'arrivée aux tirs au but */
    #so-banner {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: rgba(10, 10, 10, 0.92);
      border-left: 4px solid #F5C400;
      padding: 12px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }
    #so-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #so-banner-title {
      font-size: 30px;
      font-weight: 800;
      color: #F5C400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #so-banner-teams {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <!-- Timeout banner -->
  <div id="timeout-banner">
    <span id="timeout-label">⏸ TEMPS MORT</span>
    <span id="timeout-team"></span>
    <span id="timeout-timer">1:00</span>
  </div>

  <!-- Bandeau tirs au but -->
  <div id="so-banner">
    <span id="so-banner-title">🥅 Tirs au but</span>
    <span id="so-banner-teams"></span>
  </div>

  <!-- Main scoreboard -->
  <div id="scoreboard">

    <!-- Badges 2 minutes domicile (à l'extérieur, au bout du bandeau) -->
    <div class="min2-badges" id="home-min2-badges"></div>

    <!-- Home team -->
    <div class="team-block" id="team-home">
      <span class="team-name" id="home-name">DOMICILE</span>
      <div class="so-row" id="home-so-row"></div>
    </div>

    <!-- Score center -->
    <div id="score-center">
      <div class="score-digit" id="home-score">0</div>
      <!-- Timer -->
      <div id="timer-block">
        <div id="trc-badge">TRC</div>
        <div id="timer-display">00:00</div>
        <div id="so-tally">0 – 0</div>
        <div id="period-label">1ÈRE MI-TEMPS</div>
      </div>
      <div class="score-digit" id="away-score">0</div>
    </div>

    <!-- Away team -->
    <div class="team-block" id="team-away">
      <span class="team-name" id="away-name">EXTÉRIEUR</span>
      <div class="so-row" id="away-so-row"></div>
    </div>

    <!-- Badges 2 minutes extérieur (à l'extérieur, au bout du bandeau) -->
    <div class="min2-badges" id="away-min2-badges"></div>

  </div>

  <script>
    // ── STATE ──
const state = {
  homeScore: 0, awayScore: 0,
  homeSanctions: { red:0, min2:0 },
  awaySanctions: { red:0, min2:0 },
  timerRunning: false,
  timerSeconds: 0,
  period: 1,
  scoreboardVisible: true,
  timeoutActive: false,
  trcActive: false,
  shootout: { home: [], away: [] },   // un booléen par tir : true = marqué, false = raté
};

let timerInterval = null;

// Piles des badges "2 minutes" actuellement affichés à l'écran, pour pouvoir en
// retirer un précisément quand le panneau de contrôle annule une exclusion
// (clic sur un emplacement 2min, ou "−" sur un carton rouge qui l'avait générée).
const min2Chips = { home: [], away: [] };

// ── TIMER ──
function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2,'0');
  const ss = (s % 60).toString().padStart(2,'0');
  return `${m}:${ss}`;
}

function tickTimer() {
  state.timerSeconds++;
  document.getElementById('timer-display').textContent = formatTime(state.timerSeconds);
}

function startTimer()  { if (!state.timerRunning) { state.timerRunning = true; timerInterval = setInterval(tickTimer, 1000); } }
function pauseTimer()  { if (state.timerRunning)  { state.timerRunning = false; clearInterval(timerInterval); } }
function toggleTimer() { state.timerRunning ? pauseTimer() : startTimer(); }
function resetTimer()  { pauseTimer(); state.timerSeconds = 0; document.getElementById('timer-display').textContent = '00:00'; }

// Réglage manuel du chrono (flèches ▲▼ chiffre par chiffre dans le panneau de
// contrôle) : celui-ci envoie directement le nouveau temps total en secondes.
function setTimerSeconds(seconds) {
  state.timerSeconds = Math.max(0, seconds || 0);
  document.getElementById('timer-display').textContent = formatTime(state.timerSeconds);
}

// dir vaut 1 (période suivante) ou -1 (période précédente) ; 1 par défaut
// pour rester compatible avec un ancien appel sans argument.
function nextPeriod(dir = 1) {
  const prev = state.period;
  state.period = Math.min(Math.max(state.period + dir, 1), 3);
  const labels = ['', '1ÈRE MI-TEMPS', '2ÈME MI-TEMPS', 'TIRS AU BUT'];
  document.getElementById('period-label').textContent = labels[state.period] || 'TIRS AU BUT';
  if (state.period === 3 && prev !== 3) enterShootout();
  else if (prev === 3 && state.period !== 3) exitShootout();
}

// ── TIRS AU BUT ──
let soBannerTimeout = null;

function renderShootout() {
  // Même nombre de pastilles des deux côtés : 5 minimum, plus en cas de mort subite.
  const n = Math.max(5, state.shootout.home.length, state.shootout.away.length);
  ['home', 'away'].forEach(team => {
    const row = document.getElementById(`${team}-so-row`);
    const shots = state.shootout[team];
    row.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const pip = document.createElement('div');
      const taken = i < shots.length;
      pip.className = 'so-pip' + (taken ? (shots[i] ? ' goal' : ' miss') : '');
      pip.textContent = taken ? (shots[i] ? '✓' : '✕') : '';
      row.appendChild(pip);
    }
  });
  const h = state.shootout.home.filter(Boolean).length;
  const a = state.shootout.away.filter(Boolean).length;
  document.getElementById('so-tally').textContent = `${h} – ${a}`;
}

function enterShootout() {
  pauseTimer();   // le chrono n'a plus lieu d'être pendant les tirs au but
  document.getElementById('scoreboard').classList.add('shootout');
  renderShootout();

  document.getElementById('so-banner-teams').textContent =
    `${document.getElementById('home-name').textContent} ${state.homeScore} – ${state.awayScore} ${document.getElementById('away-name').textContent}`;
  const banner = document.getElementById('so-banner');
  clearTimeout(soBannerTimeout);
  if (state.scoreboardVisible) {
    banner.classList.add('show');
    soBannerTimeout = setTimeout(() => banner.classList.remove('show'), 5000);
  }
}

function exitShootout() {
  document.getElementById('scoreboard').classList.remove('shootout');
  clearTimeout(soBannerTimeout);
  document.getElementById('so-banner').classList.remove('show');
}

// cmd : 'goal' (tir marqué) | 'miss' (tir raté) | 'undo' (annule le dernier tir de l'équipe) | 'reset'
function shootoutAction(team, cmd) {
  if (cmd === 'reset') {
    state.shootout.home = [];
    state.shootout.away = [];
  } else {
    const shots = state.shootout[team];
    if (!shots) return;
    if (cmd === 'goal') shots.push(true);
    else if (cmd === 'miss') shots.push(false);
    else if (cmd === 'undo') shots.pop();
  }
  renderShootout();
}

// ── SCORES ──
function addScore(team, delta=1) {
  if (team === 'home') {
    state.homeScore = Math.max(0, state.homeScore + delta);
    document.getElementById('home-score').textContent = state.homeScore;
  } else {
    state.awayScore = Math.max(0, state.awayScore + delta);
    document.getElementById('away-score').textContent = state.awayScore;
  }
}

// ── SANCTIONS ──
function addSanction(team, type, delta=1) {
  const s = team === 'home' ? state.homeSanctions : state.awaySanctions;
  s[type] = Math.max(0, (s[type] || 0) + delta);

  if (type === 'min2') {
    if (delta > 0) { for (let i=0;i<delta;i++) addExclusionChip(team); }
    else if (delta < 0) { for (let i=0;i<-delta;i++) removeExclusionChip(team); }
  }

  // Un carton rouge (disqualification) entraîne automatiquement une exclusion de
  // 2 minutes — dans un sens comme dans l'autre, y compris à l'annulation.
  if (type === 'red' && delta !== 0) {
    s.min2 = Math.max(0, (s.min2 || 0) + delta);
    if (delta > 0) { for (let i=0;i<delta;i++) addExclusionChip(team); }
    else { for (let i=0;i<-delta;i++) removeExclusionChip(team); }
  }
}

// ── BADGES 2 MINUTES (collés au bandeau, hors de son flux) ──
function addExclusionChip(team) {
  const container = document.getElementById(team === 'home' ? 'home-min2-badges' : 'away-min2-badges');
  const chip = document.createElement('div');
  chip.className = 'min2-chip';
  chip.textContent = '2:00';
  container.appendChild(chip);

  // Le badge disparaît soit à l'échéance de son propre décompte, soit sur
  // annulation explicite via removeExclusionChip. Il se met en pause en même
  // temps que le chrono du match.
  let rem = 120;
  const iv = setInterval(() => {
    if (!state.timerRunning) return;
    rem--;
    if (rem <= 0) { clearInterval(iv); chip.remove(); removeChipFromStack(team, chip); return; }
    chip.textContent = formatTime(rem);
  }, 1000);

  min2Chips[team].push({ el: chip, iv });
}

// Retire le badge le plus récemment posé pour l'équipe donnée — appelé quand le
// panneau de contrôle annule une exclusion 2min ou un carton rouge.
function removeExclusionChip(team) {
  const stack = min2Chips[team];
  const entry = stack.pop();
  if (!entry) return;
  clearInterval(entry.iv);
  entry.el.remove();
}

function removeChipFromStack(team, chipEl) {
  const stack = min2Chips[team];
  const idx = stack.findIndex(c => c.el === chipEl);
  if (idx !== -1) stack.splice(idx, 1);
}

// ── TOGGLE VISIBILITY ──
function toggleScoreboard() {
  state.scoreboardVisible = !state.scoreboardVisible;
  document.getElementById('scoreboard').classList.toggle('hidden', !state.scoreboardVisible);
}

// ── TIMEOUT ──
let timeoutInterval = null;
let timeoutSeconds = 60;

function formatTimeoutTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function startTimeoutCountdown() {
  clearInterval(timeoutInterval);
  timeoutSeconds = 60;
  document.getElementById('timeout-timer').textContent = formatTimeoutTime(timeoutSeconds);
  timeoutInterval = setInterval(() => {
    timeoutSeconds--;
    if (timeoutSeconds <= 0) {
      clearInterval(timeoutInterval);
      endTimeoutAuto();
      return;
    }
    document.getElementById('timeout-timer').textContent = formatTimeoutTime(timeoutSeconds);
  }, 1000);
}

// Fin automatique de la minute de temps mort : le bandeau disparaît,
// le chrono du match reste en pause (il ne redémarre jamais tout seul).
function endTimeoutAuto() {
  state.timeoutActive = false;
  document.getElementById('timeout-banner').classList.remove('show');
}

// payload est optionnel (ex: { team: 'home' }) et n'est utilisé que s'il est fourni,
// pour ne rien changer au contrat des messages BroadcastChannel existants.
function toggleTimeout(payload) {
  state.timeoutActive = !state.timeoutActive;
  document.getElementById('timeout-banner').classList.toggle('show', state.timeoutActive);

  if (state.timeoutActive) {
    const teamEl = document.getElementById('timeout-team');
    if (payload && payload.team) {
      teamEl.textContent = payload.team === 'home'
        ? document.getElementById('home-name').textContent
        : document.getElementById('away-name').textContent;
    } else {
      teamEl.textContent = '';
    }
    startTimeoutCountdown();
    pauseTimer();
  } else {
    clearInterval(timeoutInterval);
    // Le chrono ne redémarre jamais automatiquement : c'est à l'opérateur de le relancer.
  }
}

// ── TRC (Temps de Régulation Comportemental) ──
// Simple bascule visuelle : premier clic = affichage du badge, second clic = disparition.
// Aucun décompte, aucun effet sur le chrono du match.
function toggleTrc() {
  state.trcActive = !state.trcActive;
  document.getElementById('trc-badge').classList.toggle('active', state.trcActive);
}

// ── KEYBOARD BINDINGS ── (raccourcis propres à la fenêtre overlay elle-même)
// Space         → Play/Pause timer
// R             → Reset timer
// P             → Next period
// Shift+P       → Previous period
// Q/E           → Home −1 / +1 score
// V             → Toggle scoreboard visibility
// T             → Timeout
// U             → TRC (bascule simple, sans décompte)
// Sanctions HOME : 2=carton rouge (→ 2min auto)  5=2min
// Sanctions AWAY : 7=carton rouge (→ 2min auto)  0=2min
// Shift+key     → Annuler une sanction (−1)

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const shift = e.shiftKey;

  switch(e.key) {
    case ' ':      e.preventDefault(); toggleTimer(); break;
    case 'r': case 'R': resetTimer(); break;
    case 'p': case 'P': nextPeriod(shift ? -1 : 1); break;
    case 'q': case 'Q': addScore('home', shift ? -1 : 1); break;
    case 'e': case 'E': addScore('away', shift ? -1 : 1); break;
    case 'u': case 'U': toggleTrc(); break;
    case 'v': case 'V': toggleScoreboard(); break;
    case 'f': case 'F': if (state.period === 3) shootoutAction('home', shift ? 'undo' : 'goal'); break;
    case 'g': case 'G': if (state.period === 3) shootoutAction('home', shift ? 'undo' : 'miss'); break;
    case 'j': case 'J': if (state.period === 3) shootoutAction('away', shift ? 'undo' : 'goal'); break;
    case 'k': case 'K': if (state.period === 3) shootoutAction('away', shift ? 'undo' : 'miss'); break;
    case 't': case 'T': toggleTimeout(); break;
    case '2': addSanction('home','red',    shift?-1:1); break;
    case '5': addSanction('home','min2',   shift?-1:1); break;
    case '7': addSanction('away','red',    shift?-1:1); break;
    case '0': addSanction('away','min2',   shift?-1:1); break;
  }
});

// ── BroadcastChannel (communication avec le panneau de contrôle) ──
const bc = new BroadcastChannel('handball_overlay');
bc.onmessage = (e) => {
  const { action, payload } = e.data;
  switch(action) {
    case 'score':      addScore(payload.team, payload.delta); break;
    case 'sanction':   addSanction(payload.team, payload.type, payload.delta); break;
    case 'timer':
      if (payload.cmd === 'start') startTimer();
      else if (payload.cmd === 'pause') pauseTimer();
      else if (payload.cmd === 'reset') resetTimer();
      else if (payload.cmd === 'set') setTimerSeconds(payload.seconds);
      break;
    case 'period':     nextPeriod(payload && payload.dir === -1 ? -1 : 1); break;
    case 'timeout':    toggleTimeout(payload); break;
    case 'trc':        toggleTrc(); break;
    case 'shootout':   shootoutAction(payload.team, payload.cmd); break;
    case 'visibility': toggleScoreboard(); break;
    case 'setNames':
      if(payload.home) document.getElementById('home-name').textContent = payload.home.toUpperCase();
      if(payload.away) document.getElementById('away-name').textContent = payload.away.toUpperCase();
      break;
  }
};
  </script>
</body>

</html>
